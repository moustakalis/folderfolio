nodeLinker: node-modules

# Development happens on macOS arm64, CI runs on Linux x64. Berry resolves
# optional dependencies for the current platform only unless told otherwise,
# and esbuild ships one binary package per platform - so a lockfile built on
# either machine alone would be missing the other's binary.
#
# Listing foreign platforms also makes Yarn skip every package build script,
# since it cannot meaningfully run one for a platform it is not on. esbuild
# does not need its postinstall when the platform package is present, but
# Playwright does: browsers are installed explicitly by the test:e2e task.
supportedArchitectures:
  os:
    - darwin
    - linux
  cpu:
    - arm64
    - x64
