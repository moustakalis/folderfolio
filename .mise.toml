[tasks."deps:install"]
description = "Install project dependencies"
run = """
composer install
npm ci
"""

[tasks."assets:build"]
description = "Type-check and build production assets"
run = """
npm run build
"""

[tasks."assets:watch"]
description = "Watch and rebuild assets during development"
run = """
npm run dev
"""

[tasks."test:unit"]
description = "Run PHPUnit tests"
run = """
phpunit
"""

[tasks."test:e2e"]
description = "Run browser end-to-end tests"
run = """
npx playwright test
"""

[tasks."dev:clean"]
description = "Remove build artifacts but keep node_modules and vendor for faster rebuilds"
run = """
rm -rf build dist assets/build
"""

[tasks."dev:clean-all"]
description = "Remove all generated dependencies and build output including node_modules and vendor"
run = """
rm -rf node_modules vendor build dist assets/build
"""

[tasks."dev:zip"]
description = "Create a distributable plugin ZIP"
depends = ["assets:build"]
run = """
set -eu

PLUGIN_SLUG=\"folderfolio\"
DIST_DIR=\"dist\"
STAGE_DIR=\"${DIST_DIR}/${PLUGIN_SLUG}\"
ZIP_FILE=\"${DIST_DIR}/${PLUGIN_SLUG}.zip\"

# Always start from a clean distribution folder.
rm -rf \"${DIST_DIR}\" \"${ZIP_FILE}\"
mkdir -p \"${STAGE_DIR}\"

# Copy runtime PHP source.
cp \"${PLUGIN_SLUG}.php\" \"${STAGE_DIR}/\"
cp -R includes \"${STAGE_DIR}/\"

# Copy compiled frontend assets from Vite output.
if [ -d assets/build ]; then
  cp -R assets/build \"${STAGE_DIR}/assets/\"
fi

# Copy public assets if they exist.
if [ -d public ]; then
  cp -R public \"${STAGE_DIR}/\"
fi

# Copy documentation and license files if they exist.
for f in LICENSE README.md readme.txt; do
  if [ -f \"$f\" ]; then
    cp \"$f\" \"${STAGE_DIR}/\"
  fi
done

# Create the ZIP with a single top-level folder.
(
  cd \"${DIST_DIR}\"
  zip -qr \"${PLUGIN_SLUG}.zip\" \"${PLUGIN_SLUG}\"
)

# Remove the staging directory.
rm -rf \"${STAGE_DIR}\"

echo \"Created ${ZIP_FILE}\"
"""
