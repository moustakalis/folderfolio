[tasks."deps:install"]
description = "Install project dependencies"
run = """
composer install
npm ci
"""

[tasks."assets:build"]
description = "Type-check and build production assets"
run = """
npm run build
"""

[tasks."test:unit"]
description = "Run PHPUnit tests"
run = """
phpunit
"""

[tasks."test:e2e"]
description = "Run browser end-to-end tests"
run = """
npx playwright test
"""

[tasks."dev:clean"]
description = "Remove generated dependencies and build output"
run = """
rm -rf node_modules vendor build dist assets/build
"""

[tasks."dev:zip"]
description = "Create a distributable plugin ZIP"
depends = ["assets:build"]
run = """
set -eu

PLUGIN_SLUG=\"folderfolio\"
DIST_DIR=\"dist\"
STAGE_DIR=\"${DIST_DIR}/${PLUGIN_SLUG}\"

# Start from a clean distribution folder.
rm -rf \"${DIST_DIR}\"
mkdir -p \"${STAGE_DIR}\"

# Copy runtime PHP source.
cp \"${PLUGIN_SLUG}.php\" \"${STAGE_DIR}/\"
cp -R src \"${STAGE_DIR}/\"

# Copy compiled frontend assets from Vite output.
# Adjust this path if your vite.config.ts uses a different outDir.
if [ -d assets/build ]; then
  cp -R assets/build \"${STAGE_DIR}/build\"
fi

# Copy public assets if they exist.
if [ -d public ]; then
  cp -R public \"${STAGE_DIR}/\"
fi

# Copy root assets (CSS, SVG, etc.) if they exist.
if [ -d assets ] && [ ! -d assets/build ]; then
  cp -R assets \"${STAGE_DIR}/\"
elif [ -d assets ]; then
  # Copy only non-build files from assets.
  for f in assets/*; do
    case \"$(basename \"$f\")\" in
      build|src) continue ;;
    esac
    cp -R \"$f\" \"${STAGE_DIR}/assets/\"
  done
fi

# Copy documentation and license files if they exist.
for f in LICENSE README.md readme.txt; do
  if [ -f \"$f\" ]; then
    cp \"$f\" \"${STAGE_DIR}/\"
  fi
done

# Create the ZIP with a single top-level folder.
(
  cd \"${DIST_DIR}\"
  zip -qr \"${PLUGIN_SLUG}.zip\" \"${PLUGIN_SLUG}\"
)

# Remove the staging directory.
rm -rf \"${STAGE_DIR}\"
"""
