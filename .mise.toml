[tools]
node = "20"
php = "8.2"

[env]
PHP_WITHOUT_PEAR = "yes"
_.path = ["./vendor/bin", "./node_modules/.bin"]
NODE_ENV = "development"

[tasks."deps:install"]
description = "Install project dependencies"
run = """
composer install --no-interaction --prefer-dist
npm install
"""

[tasks."assets:build"]
description = "Type-check and build production assets"
run = "npm run build"

[tasks."test:unit"]
description = "Run PHP unit tests"
run = "composer test"

[tasks."test:e2e"]
description = "Run browser end-to-end tests"
run = "npm run test:e2e"

[tasks."dev:clean"]
description = "Remove generated dependencies and build output"
run = """
rm -rf assets/build build vendor node_modules .phpunit.cache playwright-report
"""

[tasks."dev:zip"]
description = "Create a distributable plugin ZIP"
run = """
rm -rf build
mkdir -p build/folderfolio
rsync -a \
  --exclude='.git' \
  --exclude='.github' \
  --exclude='node_modules' \
  --exclude='tests' \
  --exclude='build' \
  --exclude='*.map' \
  --exclude='.DS_Store' \
  --exclude='phpunit.xml.dist' \
  --exclude='phpstan.neon' \
  --exclude='playwright*' \
  --exclude='*.spec.ts' \
  --exclude='composer.json' \
  --exclude='composer.lock' \
  --exclude='package.json' \
  --exclude='package-lock.json' \
  --exclude='Makefile' \
  ./ build/folderfolio/
cd build && zip -qr folderfolio-latest.zip folderfolio/
"""
