name: Build and Test Plugin

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    name: Build Plugin ZIP
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          tools: composer:v2
          coverage: none

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install Node dependencies
        run: npm ci

      - name: Build assets
        run: npm run build

      - name: Assemble installable plugin
        run: bash bin/build-zip.sh

      - name: Upload plugin ZIP
        uses: actions/upload-artifact@v4
        with:
          name: folderfolio-plugin-${{ github.sha }}
          path: dist/folderfolio.zip
          retention-days: 30

  php-tests:
    name: PHP Tests
    runs-on: ubuntu-latest

    services:
      mysql:
        image: mariadb:11
        env:
          MYSQL_ROOT_PASSWORD: wordpress
          MYSQL_DATABASE: wordpress_test
          MYSQL_USER: wordpress
          MYSQL_PASSWORD: wordpress
          MARIADB_INITDB_SKIP_TZINFO: 1
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mariadb-admin ping -h 127.0.0.1 -uwordpress -pwordpress"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          tools: composer:v2
          coverage: none

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: |
          composer install --prefer-dist --no-interaction
          npm ci

      - name: Set up WordPress test library
        uses: sjinks/setup-wordpress-test-library@master
        with:
          version: latest
          db_name: wordpress_test
          db_user: wordpress
          db_password: wordpress
          db_host: 127.0.0.1:${{ job.services.mysql.ports[3306] }}

      - name: Verify database connection
        run: |
          while ! mysqladmin ping \
            -h 127.0.0.1 \
            -P "${{ job.services.mysql.ports[3306] }}" \
            -uwordpress \
            -pwordpress \
            --silent; do
            sleep 1
          done
        timeout-minutes: 1

      - name: Run PHPUnit
        run: composer test

      - name: Run PHPStan
        run: composer phpstan
