name: Build and Test Plugin

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    name: Build Plugin ZIP
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      # Corepack must be enabled BEFORE setup-node.
      #
      # `cache: yarn` makes setup-node run `yarn cache dir` during its own
      # step. Without Corepack that is the runner's global Yarn 1.22, which
      # refuses outright because package.json pins yarn@4.x via
      # `packageManager` — the step fails before any step of ours runs.
      #
      # `npm i -g corepack@latest` rather than the Corepack bundled with Node:
      # the bundled one is frequently older than the Yarn release being pinned
      # and fails signature verification on it. It is also being unbundled in
      # newer Node, so installing it explicitly is the durable form.
      - name: Enable Corepack
        run: |
          npm install -g corepack@latest
          corepack enable

      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: '22'
          cache: 'yarn'

      - name: Install Node dependencies
        run: yarn install --immutable

      - name: Build assets
        run: yarn build

      # The rail's decision functions — planPaste, planSiblingMove, sortTree —
      # decide both whether a menu row is enabled and which request a press
      # sends. Plain functions over plain trees, so plain Node: no browser.
      - name: Unit-test the rail's decision functions
        run: yarn test:js

      # The React-onto-wp.element aliasing is the one piece of the build whose
      # failure modes are all silent: a bundled second React works perfectly
      # until it renders inside a core tree, and a jsx runtime that loses
      # `key` renders a correct-looking list that reorders wrongly. Neither is
      # visible to tsc or to a successful build, so it is checked in a real
      # browser. See tools/verify-pipeline.mjs.
      - name: Install Chromium
        run: yarn playwright install --with-deps chromium

      - name: Verify the wp-element pipeline
        run: yarn test:pipeline

      # Two more browser harnesses, for the two other things that fail
      # silently: a React portal whose container core replaced underneath it
      # (the controls simply stop coming back, with no error), and the tree's
      # roving tabindex, whose failure is that the whole tree leaves the tab
      # order while looking perfectly normal.
      - name: Verify the toolbar slot
        run: yarn test:slot

      - name: Verify the tree's keyboard invariant
        run: yarn test:tree

      # WordPress Playground downloads a WordPress build (~36MB) on its first
      # boot and caches it under ~/.wordpress-playground. Without this, every
      # run is a cold boot — which is what made the 3-minute webServer timeout
      # fire on a runner while never firing on a developer machine.
      #
      # Keyed on the lockfile so a Playground upgrade re-downloads rather than
      # restoring a build it no longer wants.
      - name: Cache WordPress Playground
        uses: actions/cache@v4
        with:
          path: ~/.wordpress-playground
          key: playground-${{ runner.os }}-${{ hashFiles('yarn.lock') }}
          restore-keys: |
            playground-${{ runner.os }}-

      # End to end against a real WordPress, booted by the test run itself on
      # php-wasm — no Docker, no database, no site to point at.
      #
      # The boot lives in tests/e2e/global-setup.ts rather than in Playwright's
      # `webServer` block, because Playground accepts connections half a second
      # in and answers 502 for the next fifteen while it installs WordPress —
      # which neither of Playwright's readiness mechanisms handles, and whose
      # failure here was a bare "Timed out waiting 180000ms".
      #
      # What gets mounted is the staged plugin, not the checkout, so this also
      # runs against the same file set bin/build-zip.sh ships.
      - name: End-to-end
        run: yarn test:e2e

      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@v6
        with:
          name: playwright-report-${{ github.sha }}
          path: playwright-report/
          retention-days: 7

      # No PHP here on purpose: bin/build-zip.sh copies an allowlist and zips
      # it. It runs no PHP and needs no Composer.
      - name: Assemble installable plugin
        run: bash bin/build-zip.sh

      # v5 of this action still runs on Node 20; v6 is the first on Node 24.
      - name: Upload plugin ZIP
        uses: actions/upload-artifact@v6
        with:
          name: folderfolio-plugin-${{ github.sha }}
          path: dist/folderfolio.zip
          retention-days: 30

  # What wordpress.org's reviewers run, against what would be uploaded: the
  # ZIP the build job made, not the checkout. It was 493 findings (255
  # errors) the first time it ran, on 24 Sep; it is 0 now and has to stay 0.
  plugin-check:
    name: Plugin Check
    needs: build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Download the plugin ZIP
        uses: actions/download-artifact@v5
        with:
          name: folderfolio-plugin-${{ github.sha }}
          path: dist

      - name: Unpack it
        run: unzip -q dist/folderfolio.zip -d dist/check

      - name: Plugin Check
        uses: WordPress/plugin-check-action@v1
        with:
          build-dir: dist/check/folderfolio

      # The POT is generated, so it can go stale without anything failing:
      # a string changed in PHP and the POT still has the old one. Regenerate
      # it and compare, ignoring the creation date. The runner image's own
      # PHP is enough for WP-CLI.
      - name: The POT matches the source
        run: |
          curl -fsSLo /tmp/wp-cli.phar https://raw.githubusercontent.com/wp-cli/builds/gh-pages/phar/wp-cli.phar
          php /tmp/wp-cli.phar i18n make-pot . /tmp/folderfolio.pot --slug=folderfolio --domain=folderfolio \
            --exclude=assets,node_modules,vendor,tests,tools,design,docs,var,dist,phpstan,public,bin \
            --headers='{"Report-Msgid-Bugs-To":"https://github.com/moustakalis/folderfolio/issues"}'
          diff <(grep -v '^"POT-Creation-Date' languages/folderfolio.pot) <(grep -v '^"POT-Creation-Date' /tmp/folderfolio.pot) \
            || { echo "languages/folderfolio.pot is stale: run the make-pot line above and commit it." >&2; exit 1; }

  php-tests:
    name: PHP Tests (${{ matrix.php }}${{ matrix.multisite == '1' && ', multisite' || '' }})
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        php: ['8.1', '8.2', '8.3', '8.4']
        multisite: ['0']
        # One leg on a network (review item #27): the tables a network
        # activation, a new site and a deleted site each owe. NetworkTest is
        # skipped everywhere else, and the rest of the suite runs here too.
        include:
          - php: '8.3'
            multisite: '1'

    services:
      mysql:
        image: mariadb:11
        env:
          MYSQL_ROOT_PASSWORD: wordpress
          MYSQL_DATABASE: wordpress_test
          MYSQL_USER: wordpress
          MYSQL_PASSWORD: wordpress
          MARIADB_INITDB_SKIP_TZINFO: 1
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mariadb-admin ping -h 127.0.0.1 -uwordpress -pwordpress"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          tools: composer:v2
          coverage: none
          # The ZIP writer's tests read its archives back with ZipArchive.
          # The plugin itself needs no zip extension — it writes ZIPs itself.
          extensions: zip

      - name: Install PHP dependencies
        run: composer install --prefer-dist --no-interaction

      # PHPStan first, and deliberately.
      #
      # phpstan.neon pins phpVersion to the 8.1–8.4 range this plugin claims,
      # so syntax that is valid on the interpreter but not across that range —
      # `readonly class`, a standalone `true` return type — is reported here in
      # seconds. Both of those got past every other check once and fatalled the
      # 8.1 leg at parse time, after WordPress had been installed and before a
      # single test ran.
      - name: Run PHPStan
        run: composer run phpstan

      # The unit suite needs no database and no WordPress, so it runs before
      # any of that is set up. When it fails, it fails in seconds.
      - name: Run unit tests
        run: composer run test:unit

      # The WordPress version is resolved here, in one step, for two reasons:
      # the cache key has to name it, and all four PHP legs should test against
      # the same WordPress rather than each resolving "latest" for itself on a
      # release day.
      - name: Resolve the WordPress version
        id: wp
        run: |
          version="$(curl -fsS https://api.wordpress.org/core/version-check/1.7/ \
            | php -r 'echo json_decode(stream_get_contents(STDIN))->offers[0]->current;')"
          echo "version=${version}" >> "$GITHUB_OUTPUT"
          echo "WordPress ${version}"

      - name: Cache WordPress and the test library
        uses: actions/cache@v4
        with:
          path: |
            var/wordpress
            var/wp-tests-lib
          key: wp-tests-${{ steps.wp.outputs.version }}-${{ hashFiles('bin/setup-wp-tests.sh') }}

      # Ours, not sjinks/setup-wordpress-test-library@master, and not
      # install-wp-tests.sh either. Both of those export the library from
      # develop.svn.wordpress.org, and **svn is no longer on the runner
      # image**: the action failed with `spawn svn ENOENT`, carried on, and
      # the job died later at a bootstrap that could not find the library.
      # The same files come out of the wordpress-develop tarball over HTTPS.
      #
      # It is also the script a developer runs, so the setup cannot drift from
      # the setup that is tested.
      - name: Set up the WordPress test library
        run: |
          bin/setup-wp-tests.sh \
            wordpress_test \
            wordpress \
            wordpress \
            127.0.0.1:${{ job.services.mysql.ports[3306] }} \
            ${{ steps.wp.outputs.version }}

      # The service has a health check, so this is belt and braces — but it
      # is written in PHP on purpose. It used to shell out to `mysqladmin`,
      # and a step that depends on a client binary the runner image happens to
      # ship is exactly the thing that broke the library setup on this job.
      # setup-php has already run; php is not in doubt.
      - name: Verify database connection
        run: |
          php -r '
            $port = (int) "${{ job.services.mysql.ports[3306] }}";
            for ($i = 0; $i < 30; $i++) {
              $db = @new mysqli("127.0.0.1", "wordpress", "wordpress", "wordpress_test", $port);
              if (!$db->connect_errno) { echo "Database is up.\n"; exit(0); }
              sleep(1);
            }
            fwrite(STDERR, "No database after 30s: " . $db->connect_error . "\n");
            exit(1);
          '
        timeout-minutes: 1

      - name: Run integration tests
        run: composer run test:integration
        env:
          WP_TESTS_DIR: ${{ github.workspace }}/var/wp-tests-lib
          WP_MULTISITE: ${{ matrix.multisite }}
