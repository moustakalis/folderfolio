name: Build and Test Plugin

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    name: Build Plugin ZIP
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          tools: composer:v2

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install PHP production dependencies
        run: composer install --no-dev --prefer-dist --no-interaction --optimize-autoloader

      - name: Install Node dependencies
        run: npm install

      - name: TypeScript type-check
        run: npx tsc --noEmit

      - name: Build JavaScript assets
        run: npm run build

      - name: Copy CSS build assets
        run: |
          mkdir -p assets/build/core
          cp assets/src/core/admin.css assets/build/core/admin.css
          cp assets/src/core/media-modal.css assets/build/core/media-modal.css

      - name: Assemble installable plugin
        run: |
          mkdir -p build/folderfolio
          rsync -a \
            --exclude='.git' \
            --exclude='.github' \
            --exclude='node_modules' \
            --exclude='tests' \
            --exclude='build' \
            --exclude='*.map' \
            --exclude='.DS_Store' \
            --exclude='phpunit.xml.dist' \
            --exclude='phpstan.neon' \
            ./ build/folderfolio/
          cd build
          zip -qr folderfolio-${{ github.sha }}.zip folderfolio

      - name: Upload plugin ZIP
        uses: actions/upload-artifact@v4
        with:
          name: folderfolio-plugin-${{ github.sha }}
          path: build/folderfolio-*.zip
          retention-days: 30

  php-tests:
    name: PHP ${{ matrix.php }} Tests
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        php: ['8.0', '8.2', '8.3']

    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: wordpress_test
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -uroot -proot"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          tools: composer:v2
          extensions: mysqli
          coverage: none

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: |
          composer install --prefer-dist --no-interaction
          npm install

      - name: Install WordPress test suite
        run: bash bin/install-wp-tests.sh wordpress_test root root 127.0.0.1 latest true

      - name: Run PHPUnit integration tests
        run: composer test

      - name: Run PHPStan
        if: matrix.php == '8.2'
        run: composer phpstan

  browser-tests:
    name: Playwright E2E Tests
    runs-on: ubuntu-latest
    needs: build

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install Node dependencies
        run: npm install

      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium

      - name: E2E test setup notice
        run: |
          echo "Playwright specifications are available for local Docker/WordPress test environments."
          echo "CI browser execution will be enabled after adding the WordPress Docker fixture."

      - name: Upload Playwright report if present
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 14
          if-no-files-found: ignore
