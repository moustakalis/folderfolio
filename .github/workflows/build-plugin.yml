name: Build and Test Plugin

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    name: Build Plugin ZIP
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      # Corepack must be enabled BEFORE setup-node.
      #
      # `cache: yarn` makes setup-node run `yarn cache dir` during its own
      # step. Without Corepack that is the runner's global Yarn 1.22, which
      # refuses outright because package.json pins yarn@4.x via
      # `packageManager` — the step fails before any step of ours runs.
      #
      # `npm i -g corepack@latest` rather than the Corepack bundled with Node:
      # the bundled one is frequently older than the Yarn release being pinned
      # and fails signature verification on it. It is also being unbundled in
      # newer Node, so installing it explicitly is the durable form.
      - name: Enable Corepack
        run: |
          npm install -g corepack@latest
          corepack enable

      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: '22'
          cache: 'yarn'

      - name: Install Node dependencies
        run: yarn install --immutable

      - name: Build assets
        run: yarn build

      # No PHP here on purpose: bin/build-zip.sh copies an allowlist and zips
      # it. It runs no PHP and needs no Composer.
      - name: Assemble installable plugin
        run: bash bin/build-zip.sh

      # v5 of this action still runs on Node 20; v6 is the first on Node 24.
      - name: Upload plugin ZIP
        uses: actions/upload-artifact@v6
        with:
          name: folderfolio-plugin-${{ github.sha }}
          path: dist/folderfolio.zip
          retention-days: 30

  php-tests:
    name: PHP Tests
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        php: ['8.1', '8.2', '8.3', '8.4']

    services:
      mysql:
        image: mariadb:11
        env:
          MYSQL_ROOT_PASSWORD: wordpress
          MYSQL_DATABASE: wordpress_test
          MYSQL_USER: wordpress
          MYSQL_PASSWORD: wordpress
          MARIADB_INITDB_SKIP_TZINFO: 1
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mariadb-admin ping -h 127.0.0.1 -uwordpress -pwordpress"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          tools: composer:v2
          coverage: none

      - name: Install PHP dependencies
        run: composer install --prefer-dist --no-interaction

      # The unit suite needs no database and no WordPress, so it runs before
      # any of that is set up. When it fails, it fails in seconds.
      - name: Run unit tests
        run: composer run test:unit

      - name: Set up WordPress test library
        uses: sjinks/setup-wordpress-test-library@master
        with:
          version: latest
          db_name: wordpress_test
          db_user: wordpress
          db_password: wordpress
          db_host: 127.0.0.1:${{ job.services.mysql.ports[3306] }}

      - name: Verify database connection
        run: |
          while ! mysqladmin ping \
            -h 127.0.0.1 \
            -P "${{ job.services.mysql.ports[3306] }}" \
            -uwordpress \
            -pwordpress \
            --silent; do
            sleep 1
          done
        timeout-minutes: 1

      - name: Run integration tests
        run: composer run test:integration

      - name: Run PHPStan
        run: composer run phpstan
