name: Build and Test Plugin

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    name: Build Plugin ZIP
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          tools: composer:v2
          coverage: none

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install PHP production dependencies
        run: composer install --no-dev --prefer-dist --no-interaction --optimize-autoloader

      - name: Install Node dependencies
        run: npm install

      - name: Build JavaScript assets
        run: npm run build

      - name: Copy CSS build assets
        run: |
          mkdir -p assets/build/core
          cp assets/src/core/admin.css assets/build/core/admin.css
          cp assets/src/core/media-modal.css assets/build/core/media-modal.css

      - name: Assemble installable plugin
        run: |
          mkdir -p build/folderfolio
          rsync -a \
            --exclude='.git' \
            --exclude='.github' \
            --exclude='node_modules' \
            --exclude='tests' \
            --exclude='build' \
            --exclude='*.map' \
            --exclude='.DS_Store' \
            --exclude='phpunit.xml.dist' \
            --exclude='phpstan.neon' \
            --exclude='playwright*' \
            --exclude='*.spec.ts' \
            --exclude='composer.json' \
            --exclude='composer.lock' \
            --exclude='package.json' \
            --exclude='package-lock.json' \
            --exclude='Makefile' \
            ./ build/folderfolio/
          cd build
          zip -qr folderfolio-${{ github.sha }}.zip folderfolio

      - name: Upload plugin ZIP
        uses: actions/upload-artifact@v4
        with:
          name: folderfolio-plugin-${{ github.sha }}
          path: build/folderfolio-*.zip
          retention-days: 30

  php-tests:
    name: PHP Tests
    runs-on: ubuntu-latest

    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: wordpress_test
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -uroot -proot"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          tools: composer:v2
          coverage: none

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: |
          composer install --prefer-dist --no-interaction
          npm install

      - name: Install WordPress test suite
        run: |
          rm -rf /tmp/wordpress /tmp/wordpress-tests-lib
          bash bin/install-wp-tests.sh wordpress_test root root 127.0.0.1 latest true
          test -f /tmp/wordpress-tests-lib/includes/functions.php
          test -f /tmp/wordpress-tests-lib/includes/class-basic-object.php

      - name: Run PHPUnit
        run: composer test

      - name: Run PHPStan
        run: composer phpstan
